# Copy of the live nginx config for this endpoint (root, by hand).

# /etc/nginx/conf.d/mcp-help.conf (http context)
limit_req_zone $binary_remote_addr zone=mcphelp:10m rate=5r/s;

# /etc/nginx/sites-enabled/dreamland.rocks, server dreamland.rocks:443
location /mcp/help {
    limit_req zone=mcphelp burst=30 nodelay;
    limit_req_status 429;
    client_max_body_size 64k;
    proxy_pass http://127.0.0.1:8003;
    proxy_http_version 1.1;
    proxy_buffering off;            # streamable HTTP may answer as SSE
    proxy_read_timeout 60s;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}

# same server block, right after `index`: dotfiles stay private, but the
# MCP Registry fetches its domain proof from /.well-known/mcp-registry-auth
location ~ /\.(?!well-known/) {
    return 404;
}
