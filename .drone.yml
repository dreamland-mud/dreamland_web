---
kind: pipeline
type: exec
name: default
concurrency:
  limit: 1

clone:
  disable: true

steps:
- name: pull
  commands:
  # Not `eval `ssh-agent -s``: drone traces each command with echo "...", which ran the
  # backticks a second time and leaked one agent per deploy.
  - ssh-agent -s > /tmp/drone-agent-web.env
  - . /tmp/drone-agent-web.env
  - trap 'kill $SSH_AGENT_PID 2>/dev/null || true' EXIT
  - ssh-add /home/dreamland/.ssh/drone
  - cd /var/www/dreamland_web
  - git pull
  - kill -9 $SSH_AGENT_PID
  
# Data for the English/Ukrainian site, straight from the game's own dumps. The
# searcher and help dumps rewrite themselves every few hours and on boot, so
# there is nothing to trigger in game first; news.xml is the exception and only
# updates when someone runs 'webdump news'. Order matters: maps writes the index
# that zonehelp reports against. build-help-pages.js and build-news.js also write
# the static one-language pages (/help/<id>.html, /en/help/, /ua/help/,
# /<lang>/news/) that search engines read instead of the apps.
- name: update_site_data
  commands:
  - /usr/bin/node /var/www/dreamland_web/site.js/build-help.js /tmp/helps.json
  - /usr/bin/node /var/www/dreamland_web/site.js/build-help-pages.js /tmp/helps.json
  - /usr/bin/node /var/www/dreamland_web/site.js/build-maps.js /home/dreamland/dreamland_mapper/public/data
  - /usr/bin/node /var/www/dreamland_web/site.js/build-zonehelp.js /tmp/helps.json /home/dreamland/dreamland_areas
  - /usr/bin/node /var/www/dreamland_web/site.js/build-news.js /tmp/news.xml
  # legends.html from the story dumps ('webdump story') + the book of legends in git
  - /usr/bin/node /var/www/dreamland_web/site.js/build-legends.js /tmp/story2.xml /tmp/story1.xml
  - /usr/bin/node /var/www/dreamland_web/site.js/build-gallery.js
  # homepage "One world" rooms, from the live area files
  - /usr/bin/node /var/www/dreamland_web/site.js/build-rooms.js /home/dreamland/dreamland_areas
  - cp /tmp/db_armor.json /tmp/db_weapon.json /tmp/db_magic.json /tmp/db_pets.json /var/www/dreamland_web/static/data/

- name: restart_searcher
  commands:
  - sudo systemctl restart dreamland-searcher.service

# Installs from the committed lockfile. On live: npm ci only, never npm install,
# which would rewrite the tracked lockfile and break the next pull. npm needs the
# newer node, but the generator runs on system node 16, so any dependency bump
# (Dependabot included) must still load on node 16 -- that is why cheerio is
# pinned to 1.0.0-rc.3. After the searcher restart, so a registry hiccup here
# can't skip the steps above.
- name: website_deps
  commands:
  - export PATH=/home/dreamland/.nodejs/current/bin:$PATH
  - cd /var/www/dreamland_web/website.js && npm ci --omit=dev --no-audit --no-fund

- name: update_website
  commands:
  - /usr/bin/node /var/www/dreamland_web/website.js/main.js /home/dreamland/runtime

# Redirect pages over every URL of the old Russian site (/ru/..., /ru/maps/...
# and the root copies) and the retired help.js's per-label pages (/help/<label>.html).
# After update_website, which writes the /maps pages the /ru/maps stubs are
# listed from; before build_sitemap, which skips them.
- name: update_stubs
  commands:
  - /usr/bin/node /var/www/dreamland_web/site.js/build-stubs.js /var/www/dreamland_web/static

# Public help MCP server (mcp-help/README.md). The unit restarts itself when
# these files change, so installing dependencies is all this step does.
- name: mcp_help
  commands:
  - export PATH=/home/dreamland/.nodejs/current/bin:$PATH
  - cd /var/www/dreamland_web/mcp-help && npm install --omit=dev --no-audit --no-fund

# After every generator above, so the sitemap lists what they just wrote. Last,
# so a failure here can't skip the searcher restart.
- name: build_sitemap
  commands:
  - /usr/bin/node /var/www/dreamland_web/site.js/build-sitemap.js /var/www/dreamland_web/static

- name: discord_failure
  commands:
  - >
    echo "{\"embeds\":[{\"color\": 13632027,\"description\":\"Latest dreamland_web failed to build, what have you done, mate?\n\",\"title\":\"Deployment failed!\"}], \"username\":\"Drone Bot\", \"avatar_url\": \"https://docs.drone.io/logo.svg\"}" \
    | /home/dreamland/runtime/bin/idiscord-code
  when:
    status:
      - failure
  
- name: discord_success
  commands:
  - >
    echo "{\"embeds\":[{\"color\": 8311585,\"description\":\"DreamLand website is updated, enjoy!\n\",\"title\":\"Deployment successful\"}], \"username\":\"Drone Bot\", \"avatar_url\": \"https://docs.drone.io/logo.svg\"}" \
    | /home/dreamland/runtime/bin/idiscord-code
  when:
    status:
      - success
      
trigger:
  branch:
  - master
  event:
  - push
  
